version: '3'
services:
  mysql:
    image: mysql:5.7
    container_name: mysql57
    restart: always
    volumes:
      - ./datadir:/var/lib/mysql
      - ./conf/my.cnf:/etc/my.cnf
      # 数据库还原目录 可将需要还原的sql文件放在这里
      - /docker/mysql/source:/docker-entrypoint-initdb.d
    environment:
      - "MYSQL_ROOT_PASSWORD=yourpass"
      - "MYSQL_DATABASE=mydb"
      - "TZ=Asia/Shanghai"
    ports:
      - 3306:3306
