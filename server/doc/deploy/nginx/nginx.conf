# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    upstream adfs.com {
        ip_hash;
        server 127.0.0.1:10050;
    }

    server {
        listen       80;
        server_name  public.u-need.cn;

        location /login {
            proxy_set_header        Host    $host;   
            proxy_set_header        X-Real-IP       $remote_addr;   
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://adfs.com/login;
        }

    }

    map $http_origin $corsHost {
       default 0;
       "~https://public.u-need.cn" https://public.u-need.cn;
       "~https://STS.cuhk.edu.cn" https://STS.cuhk.edu.cn;
    }

    server {
        listen 443 ssl;
        server_name public.u-need.cn;

	    ssl_certificate      conf.d/a.pem;
        ssl_certificate_key  conf.d/a.key;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers  on;

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        location / {
            add_header Access-Control-Allow-Origin $corsHost;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header X-Frame-Options SAMEORIGIN;
            root /opt/cuhk/mkt-pc;
            index  index index.html;
        }
   
        location /mkt {
            add_header Access-Control-Allow-Origin $corsHost;
            proxy_set_header        Host    $host;   
            proxy_set_header        X-Real-IP       $remote_addr;   
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	        proxy_set_header   Cookie $http_cookie;
            add_header X-Frame-Options SAMEORIGIN;
	        proxy_pass http://adfs.com;
        }

        location /oauth2/ {
            add_header Access-Control-Allow-Origin $corsHost;
            proxy_set_header        Host    $host;   
            proxy_set_header        X-Real-IP       $remote_addr;   
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	        proxy_set_header   Cookie $http_cookie;
            add_header X-Frame-Options SAMEORIGIN;
	        proxy_pass http://adfs.com/oauth2/;
        }
        location /adfs/ {
            add_header Access-Control-Allow-Origin $corsHost;
            proxy_set_header        Host    $host;   
            proxy_set_header        X-Real-IP       $remote_addr;   
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	        proxy_set_header   Cookie $http_cookie;
            add_header X-Frame-Options SAMEORIGIN;
	        proxy_pass http://adfs.com/adfs/;
        }
        location /login {
            add_header Access-Control-Allow-Origin $corsHost;
            proxy_set_header        Host    $host;   
            proxy_set_header        X-Real-IP       $remote_addr;   
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header X-Forwarded-Proto $scheme;
	        proxy_set_header   Cookie $http_cookie;
            add_header X-Frame-Options SAMEORIGIN;
            proxy_pass http://adfs.com/login;
        }
        location /logout {
            add_header Access-Control-Allow-Origin $corsHost;
            proxy_set_header        Host    $host;   
            proxy_set_header        X-Real-IP       $remote_addr;   
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	        proxy_set_header   Cookie $http_cookie;
            add_header X-Frame-Options SAMEORIGIN;
	        proxy_pass http://adfs.com/logout;
        }
	
        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }

}

